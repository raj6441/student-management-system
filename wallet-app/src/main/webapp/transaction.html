<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet App - Transaction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-brand">Wallet App</h1>
            <div class="nav-menu">
                <span class="nav-user" id="welcomeUser">Welcome, User</span>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="#" onclick="logout()" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="transaction-container">
            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <a href="transaction.html?action=deposit" class="tab-link" id="depositTab">
                    <span class="tab-icon">💰</span>
                    Deposit
                </a>
                <a href="transaction.html?action=withdraw" class="tab-link" id="withdrawTab">
                    <span class="tab-icon">💸</span>
                    Withdraw
                </a>
                <a href="transaction.html?action=transfer" class="tab-link" id="transferTab">
                    <span class="tab-icon">🔄</span>
                    Transfer
                </a>
            </div>

            <!-- Transaction Form -->
            <div class="transaction-form-container">
                <div id="message" class="alert" style="display: none;"></div>

                <form id="transactionForm" class="transaction-form">
                    <div id="formContent">
                        <!-- Form content will be loaded here -->
                    </div>
                    
                    <div class="form-footer">
                        <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        }

        // Display user info
        document.getElementById('welcomeUser').textContent = `Welcome, ${currentUser.fullName}`;

        // Get action from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action') || 'deposit';

        // Set active tab
        document.getElementById(action + 'Tab').classList.add('active');

        // Load form content based on action
        function loadFormContent() {
            const formContent = document.getElementById('formContent');
            
            if (action === 'deposit') {
                formContent.innerHTML = `
                    <h2 class="form-title">💰 Deposit Money</h2>
                    <p class="form-description">Add money to your wallet</p>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required 
                               placeholder="Enter amount to deposit">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input type="text" id="description" name="description" 
                               placeholder="e.g., Salary deposit">
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-full">Deposit Money</button>
                `;
            } else if (action === 'withdraw') {
                formContent.innerHTML = `
                    <h2 class="form-title">💸 Withdraw Money</h2>
                    <p class="form-description">Withdraw money from your wallet</p>
                    <p class="form-description">Current Balance: $${currentUser.balance.toFixed(2)}</p>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" max="${currentUser.balance}" required 
                               placeholder="Enter amount to withdraw">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input type="text" id="description" name="description" 
                               placeholder="e.g., ATM withdrawal">
                    </div>
                    
                    <button type="submit" class="btn btn-warning btn-full">Withdraw Money</button>
                `;
            } else if (action === 'transfer') {
                formContent.innerHTML = `
                    <h2 class="form-title">🔄 Transfer Money</h2>
                    <p class="form-description">Send money to another user</p>
                    <p class="form-description">Current Balance: $${currentUser.balance.toFixed(2)}</p>
                    
                    <div class="form-group">
                        <label for="recipientUsername">Recipient Username</label>
                        <input type="text" id="recipientUsername" name="recipientUsername" required 
                               placeholder="Enter recipient's username">
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" max="${currentUser.balance}" required 
                               placeholder="Enter amount to transfer">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input type="text" id="description" name="description" 
                               placeholder="e.g., Payment for services">
                    </div>
                    
                    <button type="submit" class="btn btn-info btn-full">Transfer Money</button>
                `;
            }
        }

        // Handle form submission
        function handleTransaction(e) {
            e.preventDefault();
            
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value || 'No description';
            const messageDiv = document.getElementById('message');
            
            // Validation
            if (amount <= 0) {
                showMessage('Please enter a valid amount greater than 0', 'error');
                return;
            }
            
            if (amount > 1000000) {
                showMessage('Amount cannot exceed $1,000,000', 'error');
                return;
            }
            
            if ((action === 'withdraw' || action === 'transfer') && amount > currentUser.balance) {
                showMessage('Insufficient balance', 'error');
                return;
            }
            
            // Handle transfer validation
            if (action === 'transfer') {
                const recipientUsername = document.getElementById('recipientUsername').value;
                if (!recipientUsername) {
                    showMessage('Please enter recipient username', 'error');
                    return;
                }
                
                if (recipientUsername === currentUser.username) {
                    showMessage('Cannot transfer to yourself', 'error');
                    return;
                }
                
                // Check if recipient exists (demo validation)
                const validRecipients = ['admin', 'john_doe'];
                if (!validRecipients.includes(recipientUsername)) {
                    showMessage('Recipient not found', 'error');
                    return;
                }
            }
            
            // Process transaction
            processTransaction(amount, description);
        }
        
        function processTransaction(amount, description) {
            // Update balance
            if (action === 'deposit') {
                currentUser.balance += amount;
            } else if (action === 'withdraw' || action === 'transfer') {
                currentUser.balance -= amount;
            }
            
            // Save updated user
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            // Add transaction to history
            const transactions = JSON.parse(localStorage.getItem('transactions')) || [];
            const newTransaction = {
                type: action === 'deposit' ? 'CREDIT' : (action === 'withdraw' ? 'DEBIT' : 'TRANSFER_OUT'),
                amount: amount,
                description: description,
                date: new Date().toISOString(),
                reference: 'TXN' + Date.now()
            };
            
            if (action === 'transfer') {
                const recipientUsername = document.getElementById('recipientUsername').value;
                newTransaction.description += ` to ${recipientUsername}`;
            }
            
            transactions.push(newTransaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            
            // Show success message
            const actionText = action === 'deposit' ? 'Deposit' : (action === 'withdraw' ? 'Withdrawal' : 'Transfer');
            showMessage(`${actionText} successful! Amount: $${amount.toFixed(2)}`, 'success');
            
            // Reset form
            document.getElementById('transactionForm').reset();
            
            // Update balance display if needed
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2000);
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `alert alert-${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            
            // Hide message after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
        
        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('transactions');
            window.location.href = 'index.html';
        }

        // Initialize page
        loadFormContent();
        document.getElementById('transactionForm').addEventListener('submit', handleTransaction);
    </script>
</body>
</html>
